# TOX : Run tests/lint consistently before deployment, Simplify your GitHub Actions YAML (replace multiple pytest commands with tox) and Catch issues early across environments.
# currently i am not using tox


[tox]
envlist = py311, lint, tests
isolated_build = True
skipsdist = True

[testenv]
deps =
    -rrequirements.txt
    pytest
commands =
    pytest -q

[testenv:lint]
description = Run linting with flake8
deps = flake8
commands = flake8 src backend tests

[testenv:tests]
description = Run all pytest tests (unit + integration)
deps =
    -rrequirements.txt
    pytest
commands =
    pytest -q src/test

[flake8]
max-line-length = 100
max-complexity = 10
exclude =
    .git,
    __pycache__,
    build,
    dist,
    .tox,
    .venv